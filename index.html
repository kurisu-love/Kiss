/* ---------- звук ---------- */
function mk(){const a=new Audio();
 a.onplay=a.onpause=()=>{if(a===au)sync()};
 a.onseeked=a.onloadedmetadata=()=>{if(a===au)notify()};
 a.onended=()=>{if(a!==au||fading)return;if(endSl){endSl=0;slm=0;return a.pause()}step(1)};
 a.ontimeupdate=()=>{if(a!==au)return;if(!drag){$('#fc1').textContent=fmt(a.currentTime);$('#fc2').textContent=fmt(a.duration);const p=a.duration?a.currentTime/a.duration*1000:0;$('#fseek').value=p;$('#fseek').style.setProperty('--p',p/10+'%')}xf()};
 return a}
const E=[mk(),mk()];let ai=0,au=E[0];
function initAudio(){if(ctx)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();
 bands=FQ.map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i==0?'lowshelf':i==9?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.1;b.gain.value=S.eqOn?S.eq[i]:0;return b});
 an=ctx.createAnalyser();an.fftSize=256;
 for(let i=0;i<9;i++)bands[i].connect(bands[i+1]);bands[9].connect(an);an.connect(ctx.destination);
 E.forEach(a=>ctx.createMediaElementSource(a).connect(bands[0]))}catch(e){ctx=null}}
function eqApply(){bands.forEach((b,i)=>b.gain.value=S.eqOn?S.eq[i]:0)}
function rate(a){a.playbackRate=S.speed;a.preservesPitch=!!S.keep;a.webkitPreservesPitch=!!S.keep}
function go2(a){initAudio();if(ctx&&ctx.state=='suspended')ctx.resume();const p=a.play();if(p&&p.catch)p.catch(()=>{})}
function xf(){if(!S.cf||fading||rep||queue.length<2||!isFinite(au.duration))return;const rem=au.duration-au.currentTime;if(rem>S.cf||rem<.3)return;
 fading=1;const old=au,w=E[ai^1];qi=shuf?Math.floor(Math.random()*queue.length):(qi+1)%queue.length;const t=queue[qi];
 w.src=URL.createObjectURL(t.audio);rate(w);w.volume=0;go2(w);ai^=1;au=w;sync();markCur();
 const T=S.cf*1000,t0=Date.now(),iv=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/T);old.volume=1-k;w.volume=k;if(k>=1){clearInterval(iv);old.pause();URL.revokeObjectURL(old.src);old.removeAttribute('src');old.volume=1;fading=0}},80)}
function play(arr,i){queue=arr.slice();qi=i;load()}
function load(){const t=queue[qi];if(!t)return;E.forEach(e=>{if(e!==au)e.pause()});if(au.src)URL.revokeObjectURL(au.src);au.src=URL.createObjectURL(t.audio);au.volume=1;au.loop=!!rep;rate(au);go2(au);sync();markCur()}
const step=d=>{if(!queue.length)return;qi=shuf?Math.floor(Math.random()*queue.length):(qi+d+queue.length)%queue.length;load()};
const toggle=()=>{if(qi<0){if(tracks.length)play(tracks,0)}else au.paused?go2(au):au.pause()};
window.nativeCmd=c=>{if(c=='prev')step(-1);else if(c=='next')step(1);else if(c=='play')go2(au);else if(c=='pause')au.pause();else if(c.startsWith('seek:'))au.currentTime=+c.slice(5)/1000;else toggle()};
/* пульсация под бит */
const buf=new Uint8Array(128);
function beat(){if(!S.pulse||S.lt||!an||!$('#full').classList.contains('open')||au.paused){$('#fci').style.transform='';pl=0;return}
 an.getByteFrequencyData(buf);let s=0;for(let i=0;i<6;i++)s+=buf[i];s/=1530;$('#fci').style.transform=`scale(${1+Math.pow(s,2.2)*.1})`;requestAnimationFrame(beat)}
const kick=()=>{if(!pl&&S.pulse&&!au.paused&&$('#full').classList.contains('open')){pl=1;requestAnimationFrame(beat)}};
/* ---------- настройки ---------- */
const lum=h=>{const v=parseInt(h.slice(1),16);return(.299*(v>>16)+.587*(v>>8&255)+.114*(v&255))/255};
function setAc(h){if(!/^#?[0-9a-f]{6}$/i.test(h))return false;h=h[0]=='#'?h:'#'+h;root.style.setProperty('--ac',h);root.style.setProperty('--acf',lum(h)>.6?'#000':'#fff');S.ac=h;return true}
function applyS(){setAc(S.ac);const b=document.body;b.classList.toggle('ng',!S.glow);b.classList.toggle('lt',!!S.lt);
 [['#tg1','glow'],['#tg2','tint'],['#tg3','pulse'],['#tg4','lt']].forEach(([i,k])=>$(i).classList.toggle('on',!!S[k]));
 $('#hx').value=S.ac.toUpperCase();$('#hxs').style.background=S.ac;$$('#cf button').forEach(x=>x.classList.toggle('on',+x.dataset.v==S.cf))}
/* ---------- интерфейс ---------- */
const row=(t,i)=>`<div class="row" data-i="${i}"><div class="th" style="${bg(cv(t))}">${cv(t)?'':'♪'}</div><div class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist||'Без исполнителя')}</small></div><button class="ed" data-m="${t.id}">${I.dots}</button></div>`;
function markCur(){const c=queue[qi];$$('#list .row').forEach(r=>{const t=tracks[+r.dataset.i];r.classList.toggle('cur',!!(c&&t&&t.id==c.id))})}
function renderAll(){
 $('#pls').innerHTML=lists.map(l=>`<div class="pc" data-pl="${l.id}"><div class="pi" style="${bg(cu(l.cover,'p'+l.id))}">${l.cover?'':'♪'}</div><b>${esc(l.name)}</b><small>${l.ids.length} треков</small></div>`).join('');
 $('#pls').style.display=lists.length?'flex':'none';
 $('#list').innerHTML=tracks.length?tracks.map(row).join(''):(loaded?'<div class="empty">Пока пусто. Нажми «Добавить» или свайпни влево, чтобы загрузить первый трек.</div>':'');markCur()}
function sync(){
 const t=queue[qi],u=cv(t);
 $('#mini').classList.toggle('on',!!t);
 ['#mcv','#fci','#fgl'].forEach(s=>{const e=$(s);e.style.backgroundImage=u?`url(${u})`:'';if(s!='#fgl')e.textContent=u?'':'♪'});
 $('#mtt').textContent=$('#ftl').textContent=t?t.title:'';$('#mas').textContent=$('#fas').textContent=t?(t.artist||'Без исполнителя'):'';
 $('#mpp').innerHTML=$('#fpp').innerHTML=au.paused?I.play:I.pause;
 $('#fsh').classList.toggle('on',!!shuf);$('#frp').classList.toggle('on',!!rep);
 if(t&&t.id!=lastId){lastId=t.id;dom(t).then(c=>root.style.setProperty('--g',S.tint&&c?c:'#6b7280'))}
 kick();notify()}
$('#fsh').innerHTML=I.shuf;$('#fpv').innerHTML=I.prev;$('#fnx').innerHTML=I.next;$('#frp').innerHTML=I.rep;$('#mnx').innerHTML=I.next;$('#n1').innerHTML=I.lib;$('#n2').innerHTML=I.plus;$('#pen').innerHTML=I.pen;
$('#beq').innerHTML=I.eq+'Эквалайзер';$('#bsl').innerHTML=I.moon+'Сон';
$('#sws').innerHTML=['#FFFFFF','#0A84FF','#30D158','#FF375F','#BF5AF2','#FFD60A','#FF9F0A'].map(c=>`<button data-c="${c}" style="background:${c}"></button>`).join('');
$('#fpv').onclick=()=>step(-1);$('#fnx').onclick=$('#mnx').onclick=()=>step(1);$('#fpp').onclick=$('#mpp').onclick=toggle;
$('#fsh').onclick=()=>{shuf^=1;sync()};$('#frp').onclick=()=>{rep^=1;E.forEach(e=>e.loop=!!rep);sync()};
const sk=$('#fseek');
sk.onpointerdown=sk.ontouchstart=()=>{drag=1};sk.onpointercancel=()=>{drag=0};
sk.oninput=e=>{drag=1;$('#fc1').textContent=fmt(e.target.value/1000*(au.duration||0));sk.style.setProperty('--p',e.target.value/10+'%')};
sk.onchange=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration;drag=0};
const FU=$('#full');let fy=0,fd=0;
$('#mini').onclick=e=>{if(!e.target.closest('button')){FU.classList.add('open');kick()}};
FU.ontouchstart=e=>{if(e.target.closest('input,.bb')){fd=-1;return}fy=e.touches[0].clientY;fd=0};
FU.ontouchmove=e=>{if(fd<0)return;const d=e.touches[0].clientY-fy;if(d>0){fd=d;FU.style.transition='none';FU.style.transform=`translateY(${d}px)`}};
FU.ontouchend=()=>{if(fd<0)return;FU.style.transition='';FU.style.transform='';if(fd>130)FU.classList.remove('open');fd=0};
/* страницы и свайп */
const pg=$('#pager'),nav=$('#nav'),ind=$('#ind');
function go(i){idx=i;void pg.offsetWidth;pg.style.transition='';ind.style.transition='';pg.style.transform=`translateX(${-i*50}%)`;$$('.pg').forEach((e,k)=>e.classList.toggle('on',k==i));$$('#nav button').forEach((b,k)=>b.classList.toggle('on',k==i));nav.style.setProperty('--pr',i)}
$$('#nav button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
let sx=0,sy=0,dx=0,mode=0,st=0;
const ts=e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;st=Date.now();mode=e.target.closest('.strip')?'x':0};
const tm=e=>{if(mode=='x'||mode=='v')return;const t=e.touches[0];dx=t.clientX-sx;const dy=t.clientY-sy;
 if(!mode){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)*1.1)mode='h';else{if(Math.abs(dy)>8)mode='v';return}}
 let x=dx;if((idx==0&&x>0)||(idx==1&&x<0))x*=.25;
 pg.style.transition='none';ind.style.transition='none';pg.style.transform=`translateX(${-idx*innerWidth+x}px)`;nav.style.setProperty('--pr',Math.min(1,Math.max(0,idx-x/innerWidth)))};
const te=()=>{if(mode=='h'){const v=dx/Math.max(1,Date.now()-st);go(Math.abs(dx)>innerWidth*.12||Math.abs(v)>.3?(dx<0?1:0):idx)}mode=0};
[pg,nav].forEach(e=>{e.ontouchstart=ts;e.ontouchmove=tm;e.ontouchend=te;e.ontouchcancel=te});
/* шторки */
function sheet(h){$('#sh').onclick=$('#sh').oninput=null;$('#shi').innerHTML=h;$('#ov').classList.add('on')}
const shut=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id=='ov')shut()};
function eqUI(){const sel=Object.keys(PR).find(k=>PR[k].every((v,i)=>v==S.eq[i]));
 sheet(`<h3>Эквалайзер</h3><div class="st"><span>Включён</span><button class="sw ${S.eqOn?'on':''}" id="eqt"></button></div>
 <div class="pre">${Object.keys(PR).map(k=>`<button data-p="${k}" class="${k==sel?'on':''}">${k}</button>`).join('')}</div>
 <div class="eqb">${FQ.map((f,i)=>`<div class="bd"><div><input type="range" min="-12" max="12" step="1" value="${S.eq[i]}" data-b="${i}" style="--p:${(S.eq[i]+12)/24*100}%"></div><small>${f>=1000?f/1000+'k':f}</small></div>`).join('')}</div>
 <div class="lbl">Скорость и тон</div>
 <div class="pre"><button data-m="1,1">Обычный</button><button data-m=".82,0">Slowed</button><button data-m="1.25,0">Speed up</button></div>
 <div class="st"><span>Скорость <b id="spv">${S.speed.toFixed(2)}×</b></span></div><input type="range" id="spd" min=".5" max="2" step=".05" value="${S.speed}" style="--p:${(S.speed-.5)/1.5*100}%">
 <div class="st"><span>Сохранять тон</span><button class="sw ${S.keep?'on':''}" id="kp"></button></div>`);
 $('#sh').oninput=e=>{const r=e.target;
  if(r.dataset.b!==undefined){S.eq[+r.dataset.b]=+r.value;r.style.setProperty('--p',(+r.value+12)/24*100+'%');eqApply()}
  if(r.id=='spd'){S.speed=+r.value;r.style.setProperty('--p',(S.speed-.5)/1.5*100+'%');$('#spv').textContent=S.speed.toFixed(2)+'×';rate(au)}saveS()};
 $('#sh').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id=='eqt'){S.eqOn^=1;eqApply()}else if(b.id=='kp'){S.keep^=1;rate(au)}
  else if(b.dataset.p){S.eq=PR[b.dataset.p].slice();eqApply()}
  else if(b.dataset.m){const[v,k]=b.dataset.m.split(',');S.speed=+v;S.keep=+k;rate(au)}
  else return;saveS();eqUI()}}
function sleepUI(){const o=[[0,'Выключен'],[15,'15 минут'],[30,'30 минут'],[45,'45 минут'],[60,'1 час'],[90,'1,5 часа'],[-1,'До конца трека']];
 sheet(`<h3>Режим сна</h3>`+o.map(([v,l])=>`<button class="opt" data-v="${v}">${slm==v?'✓ ':''}${l}</button>`).join(''));
 $('#sh').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=+b.dataset.v;clearTimeout(sl);endSl=0;slm=v;if(v>0)sl=setTimeout(()=>{au.pause();slm=0},v*60000);if(v<0)endSl=1;sleepUI()}}
$('#beq').onclick=eqUI;$('#bsl').onclick=sleepUI;
/* форма трека */
function fill(id){edit=id;pend={};const t=tracks.find(x=>x.id==id),u=cv(t);
 $('#ftt').textContent=t?'Редактировать':'Новый трек';$('#ti').value=t?t.title:'';$('#ar').value=t?t.artist||'':'';
 $('#fcov').style.backgroundImage=u?`url(${u})`:'';$('#fcov').textContent=u?'':'+';$('#fl').textContent=t?'Заменить MP3 (необязательно)':'Выбрать MP3'}
$('#fcf').onchange=e=>{const f=e.target.files[0];if(!f)return;pend.cover=f;$('#fcov').style.backgroundImage=`url(${URL.createObjectURL(f)})`;$('#fcov').textContent=''};
$('#fa').onchange=e=>{const f=e.target.files[0];if(!f)return;pend.audio=f;$('#fl').textContent='✓ '+f.name;if(!$('#ti').value)$('#ti').value=f.name.replace(/\.[^.]+$/,'')};
$('#sv').onclick=async()=>{
 let t=tracks.find(x=>x.id==edit);
 if(!t&&!pend.audio){$('#fl').textContent='Сначала выбери MP3-файл';return}
 if(!t){t={id:Date.now()+(n++),audio:pend.audio,cover:null};tracks.push(t)}
 t.title=$('#ti').value.trim()||'Без названия';t.artist=$('#ar').value.trim();
 if(pend.audio)t.audio=pend.audio;if(pend.cover){t.cover=pend.cover;delete C[t.id];delete t.col}
 await put('t',t);fill(null);go(0);renderAll();sync()};
async function delTrack(id){const cur=queue[qi];await del('t',id);tracks=tracks.filter(x=>x.id!=id);
 for(const l of lists)if(l.ids.includes(id)){l.ids=l.ids.filter(i=>i!=id);await put('p',l)}
 queue=queue.filter(x=>x.id!=id);if(cur&&cur.id==id){au.pause();qi=-1}else qi=cur?queue.indexOf(cur):-1;renderAll();sync()}
function acts(id){const t=tracks.find(x=>x.id==id);
 sheet(`<h3>${esc(t.title)}</h3><button class="opt" data-a="ed">Редактировать</button><div class="lbl">Плейлисты</div>`+(lists.length?lists.map(l=>`<button class="opt" data-a="pl" data-l="${l.id}">${l.ids.includes(id)?'✓ ':''}${esc(l.name)}</button>`).join(''):'<div class="empty">Плейлистов пока нет. Создай его кнопкой ✎ сверху.</div>')+`<button class="opt red" data-a="dl">Удалить трек</button>`);
 $('#sh').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='ed'){shut();fill(id);go(1)}
  if(a=='pl'){const l=lists.find(x=>x.id==b.dataset.l);l.ids=l.ids.includes(id)?l.ids.filter(i=>i!=id):[...l.ids,id];await put('p',l);acts(id);renderAll()}
  if(a=='dl'){shut();await delTrack(id)}}}
function newPl(){pend2=null;
 sheet(`<h3>Новый плейлист</h3><div class="plh"><label class="pi" id="pcv" for="pcf">+</label><input type="file" id="pcf" accept="image/*" hidden><input class="f" id="pn" placeholder="Название плейлиста"></div><small>Обложка: фото или GIF</small><div style="height:14px"></div><button class="sv" id="pok">Создать</button>`);
 $('#pcf').onchange=e=>{const f=e.target.files[0];if(!f)return;pend2=f;$('#pcv').style.backgroundImage=`url(${URL.createObjectURL(f)})`;$('#pcv').textContent=''};
 $('#pok').onclick=async()=>{const name=$('#pn').value.trim();if(!name)return;const l={id:Date.now()+(n++),name,cover:pend2,ids:[]};lists.push(l);await put('p',l);shut();renderAll()}}
function openPl(id){const l=lists.find(x=>x.id==id),arr=l.ids.map(i=>tracks.find(t=>t.id==i)).filter(Boolean);
 sheet(`<div class="plh"><div class="pi" style="${bg(cu(l.cover,'p'+l.id))}">${l.cover?'':'♪'}</div><div><h3 style="margin:0">${esc(l.name)}</h3><small>${arr.length} треков</small></div></div><button class="sv" data-a="play">Играть</button><div style="height:10px"></div>`+arr.map(t=>`<div class="row"><div class="th" style="${bg(cv(t))}">${cv(t)?'':'♪'}</div><div class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist||'')}</small></div><button class="ed" data-r="${t.id}">✕</button></div>`).join('')+`<button class="opt red" data-a="del" style="margin-top:10px">Удалить плейлист</button>`);
 $('#sh').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a=='play'&&arr.length){shut();play(arr,0)}
  if(b.dataset.a=='del'){shut();lists=lists.filter(x=>x.id!=id);await del('p',id);renderAll()}
  if(b.dataset.r){l.ids=l.ids.filter(i=>i!=b.dataset.r);await put('p',l);renderAll();openPl(id)}}}
$('#pen').onclick=newPl;
$('#list').onclick=e=>{const m=e.target.closest('[data-m]');if(m)return acts(+m.dataset.m);const r=e.target.closest('.row');if(r)play(tracks,+r.dataset.i)};
$('#pls').onclick=e=>{const c=e.target.closest('[data-pl]');if(c)openPl(+c.dataset.pl)};
async function clearAll(){await wipe('t');await wipe('p');tracks=[];lists=[];queue=[];qi=-1;E.forEach(e=>e.pause());au.removeAttribute('src');lastId=0;root.style.setProperty('--g','#8a8f9c');renderAll();sync()}
$('#sets').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id=='tg1')S.glow^=1;else if(b.id=='tg2'){S.tint^=1;lastId=0}else if(b.id=='tg3')S.pulse^=1;else if(b.id=='tg4')S.lt^=1;
 else if(b.dataset.c)setAc(b.dataset.c);else if(b.closest('#cf'))S.cf=+b.dataset.v;
 else if(b.id=='wsh'){showWel();return}else if(b.id=='clr'){if(!clr){clr=1;b.textContent='Точно? Ещё раз';return}clr=0;b.textContent='Очистить';clearAll()}
 saveS();applyS();sync()};
$('#hx').oninput=e=>{if(setAc(e.target.value.trim())){saveS();$('#hxs').style.background=S.ac}};
const REPO='https://github.com/kurisu-love/Kiss';
const W={en:{t:'Welcome to Kiss',s:'Your music. Your phone. Nothing else.',b:"Kiss is a free, open-source player for the songs you already have. Please download it only from the creator's official repository. Anywhere else isn't safe.",g:'Get started'},
ru:{t:'Добро пожаловать в Kiss',s:'Ваша музыка. Ваш телефон. Ничего лишнего.',b:'Kiss — бесплатный плеер с открытым кодом для песен, которые уже есть у вас. Скачивайте его только из официального репозитория автора: в других местах это небезопасно.',g:'Начать'}};
let wl='en';
function wset(l,anim){wl=l;const c=$('#wc'),f=()=>{$('#wt').textContent=W[l].t;$('#ws').textContent=W[l].s;$('#wb').textContent=W[l].b;$('#wg').textContent=W[l].g;$$('#wl button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));c.classList.remove('sw')};if(anim){c.classList.add('sw');setTimeout(f,180)}else f()}
function showWel(){$('#wel').classList.remove('off');wset('en',0)}
$('#wl').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.l!=wl)wset(b.dataset.l,1)};
$('#wg').onclick=()=>{try{localStorage.wd=1}catch(e){}$('#wel').classList.add('off')};
$('#wlink').href=REPO;$('#wlink').textContent=REPO.replace('https://','');wset('en',0);
applyS();fill(null);
idb().then(async d=>{db=d;tracks=await all('t');lists=await all('p');loaded=1;renderAll()}).catch(()=>{loaded=1;renderAll()});
</script></body></html>
