/* ---------- музыка с телефона ---------- */
function scanNow(){if(!A||!A.hasAudio())return;scanning=1;renderAll();
 setTimeout(()=>{try{ext=JSON.parse(A.scan()).map(x=>{const id='m'+x.i,o=ovr[id]||{};return{id,ext:1,mid:x.i,title:o.title||x.t||T('noName'),artist:o.artist!==undefined?o.artist:(x.a&&x.a!='<unknown>'?x.a:''),dur:x.d,k:x.m,cover:o.cover||null}})}catch(e){ext=[]}scanning=0;rebuild();renderAll();sync()},50)}
async function loadAll(){const r=await all('t');manual=[];ovr={};r.forEach(x=>x.ext?ovr[x.id]=x:manual.push(x));lists=await all('p');rebuild()}
/* ---------- интерфейс ---------- */
const row=(t,i)=>`<div class="row" data-i="${i}"><div class="th" style="${bg(cv(t))}">${cv(t)?'':'♪'}</div><div class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist||T('noArt'))}</small></div><button class="ed" data-m="${t.id}">${I.dots}</button></div>`;
function markCur(){const c=queue[qi];$$('#list .row').forEach(r=>{const t=V[+r.dataset.i];r.classList.toggle('cur',!!(c&&t&&t.id==c.id))})}
function renderAll(){V=vis();
 $('#pls').innerHTML=lists.map(l=>`<div class="pc" data-pl="${l.id}"><div class="pi" style="${bg(cu(l.cover,'p'+l.id))}">${l.cover?'':'♪'}</div><b>${esc(l.name)}</b><small>${l.ids.length} ${T('tracks')}</small></div>`).join('');
 $('#pls').style.display=lists.length?'flex':'none';
 shown=Math.min(120,V.length);
 $('#list').innerHTML=V.length?V.slice(0,shown).map(row).join(''):(scanning?`<div class="empty">${T('scanning')}</div>`:loaded?`<div class="empty">${T('emptyLib')}</div>`:'');markCur()}
$('#home').onscroll=()=>{const h=$('#home');if(shown<V.length&&h.scrollTop+h.clientHeight>h.scrollHeight-500){$('#list').insertAdjacentHTML('beforeend',V.slice(shown,shown+120).map((t,j)=>row(t,shown+j)).join(''));shown=Math.min(shown+120,V.length);markCur()}};
function sync(){
 const t=queue[qi],u=cv(t);
 $('#mini').classList.toggle('on',!!t);
 ['#mcv','#fci','#fgl'].forEach(s=>{const e=$(s);e.style.backgroundImage=u?`url(${u})`:'';if(s!='#fgl')e.textContent=u?'':'♪'});
 $('#mtt').textContent=$('#ftl').textContent=t?t.title:'';$('#mas').textContent=$('#fas').textContent=t?(t.artist||T('noArt')):'';
 $('#mpp').innerHTML=$('#fpp').innerHTML=au.paused?I.play:I.pause;
 $('#fsh').classList.toggle('on',!!shuf);$('#frp').classList.toggle('on',!!rep);
 if(t&&t.id!=lastId){lastId=t.id;dom(t).then(c=>root.style.setProperty('--g',S.tint&&c?c:'#6b7280'))}
 kick();notify()}
$('#fsh').innerHTML=I.shuf;$('#fpv').innerHTML=I.prev;$('#fnx').innerHTML=I.next;$('#frp').innerHTML=I.rep;$('#mnx').innerHTML=I.next;$('#n1').innerHTML=I.lib;$('#n2').innerHTML=I.plus;$('#pen').innerHTML=I.pen;$('#rth').innerHTML=I.lib.replace('M4 7h16M4 12h16M4 17h10','M4 11l8-7 8 7v9H4z');
$('#sws').innerHTML=['#FFFFFF','#0A84FF','#30D158','#FF375F','#BF5AF2','#FFD60A','#FF9F0A'].map(c=>`<button data-c="${c}" style="background:${c}"></button>`).join('');
$('#fpv').onclick=()=>step(-1);$('#fnx').onclick=$('#mnx').onclick=()=>step(1);$('#fpp').onclick=$('#mpp').onclick=toggle;
$('#fsh').onclick=()=>{shuf^=1;sync()};$('#frp').onclick=()=>{rep^=1;E.forEach(e=>e.loop=!!rep);sync()};
const sk=$('#fseek');
sk.onpointerdown=sk.ontouchstart=()=>{drag=1};sk.onpointercancel=()=>{drag=0};
sk.oninput=e=>{drag=1;$('#fc1').textContent=fmt(e.target.value/1000*(au.duration||0));sk.style.setProperty('--p',e.target.value/10+'%')};
sk.onchange=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration;drag=0};
const FU=$('#full');let fy=0,fd=0;
$('#mini').onclick=e=>{if(!e.target.closest('button')){FU.classList.add('open');kick()}};
FU.ontouchstart=e=>{if(e.target.closest('input,.bb')){fd=-1;return}fy=e.touches[0].clientY;fd=0};
FU.ontouchmove=e=>{if(fd<0)return;const d=e.touches[0].clientY-fy;if(d>0){fd=d;FU.style.transition='none';FU.style.transform=`translateY(${d}px)`}};
FU.ontouchend=()=>{if(fd<0)return;FU.style.transition='';FU.style.transform='';if(fd>130)FU.classList.remove('open');fd=0};
const pg=$('#pager'),nav=$('#nav'),ind=$('#ind');
function go(i){idx=i;void pg.offsetWidth;pg.style.transition='';ind.style.transition='';pg.style.transform=`translateX(${-i*50}%)`;$$('.pg').forEach((e,k)=>e.classList.toggle('on',k==i));$$('#nav button').forEach((b,k)=>b.classList.toggle('on',k==i));nav.style.setProperty('--pr',i);crumb()}
$$('#nav button').forEach((b,k)=>b.onclick=()=>go(k));
let sx=0,sy=0,dx=0,mode=0,st=0;
const ts=e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;dx=0;st=Date.now();mode=e.target.closest('.strip')?'x':0};
const tm=e=>{if(mode=='x'||mode=='v')return;const t=e.touches[0];dx=t.clientX-sx;const dy=t.clientY-sy;
 if(!mode){if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)*1.1)mode='h';else{if(Math.abs(dy)>8)mode='v';return}}
 let x=dx;if((idx==0&&x>0)||(idx==1&&x<0))x*=.25;
 pg.style.transition='none';ind.style.transition='none';pg.style.transform=`translateX(${-idx*innerWidth+x}px)`;nav.style.setProperty('--pr',Math.min(1,Math.max(0,idx-x/innerWidth)))};
const te=()=>{if(mode=='h'){const v=dx/Math.max(1,Date.now()-st);go(Math.abs(dx)>innerWidth*.12||Math.abs(v)>.3?(dx<0?1:0):idx)}mode=0};
[pg,nav].forEach(e=>{e.ontouchstart=ts;e.ontouchmove=tm;e.ontouchend=te;e.ontouchcancel=te});
function sheet(h){$('#sh').onclick=$('#sh').oninput=null;$('#shi').innerHTML=h;$('#ov').classList.add('on')}
const shut=()=>$('#ov').classList.remove('on');
$('#ov').onclick=e=>{if(e.target.id=='ov')shut()};
function eqUI(){const sel=Object.keys(PR).find(k=>PR[k].every((v,i)=>v==S.eq[i]));
 sheet(`<h3>${T('eq')}</h3><div class="st"><span>${T('eqOn')}</span><button class="sw ${S.eqOn?'on':''}" id="eqt"></button></div>
 <div class="pre">${Object.keys(PR).map(k=>`<button data-p="${k}" class="${k==sel?'on':''}">${T('p_'+k)}</button>`).join('')}</div>
 <div class="eqb">${FQ.map((f,i)=>`<div class="bd"><div><input type="range" min="-12" max="12" step="1" value="${S.eq[i]}" data-b="${i}" style="--p:${(S.eq[i]+12)/24*100}%"></div><small>${f>=1000?f/1000+'k':f}</small></div>`).join('')}</div>
 <div class="lbl">${T('speedTone')}</div>
 <div class="pre"><button data-m="1,1">${T('normal')}</button><button data-m=".82,0">Slowed</button><button data-m="1.25,0">Speed up</button></div>
 <div class="st"><span>${T('speed')} <b id="spv">${S.speed.toFixed(2)}×</b></span></div><input type="range" id="spd" min=".5" max="2" step=".05" value="${S.speed}" style="--p:${(S.speed-.5)/1.5*100}%">
 <div class="st"><span>${T('keep')}</span><button class="sw ${S.keep?'on':''}" id="kp"></button></div>`);
 $('#sh').oninput=e=>{const r=e.target;
  if(r.dataset.b!==undefined){S.eq[+r.dataset.b]=+r.value;r.style.setProperty('--p',(+r.value+12)/24*100+'%');eqApply()}
  if(r.id=='spd'){S.speed=+r.value;r.style.setProperty('--p',(S.speed-.5)/1.5*100+'%');$('#spv').textContent=S.speed.toFixed(2)+'×';rate(au)}saveS()};
 $('#sh').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id=='eqt'){S.eqOn^=1;eqApply()}else if(b.id=='kp'){S.keep^=1;rate(au)}
  else if(b.dataset.p){S.eq=PR[b.dataset.p].slice();eqApply()}
  else if(b.dataset.m){const[v,k]=b.dataset.m.split(',');S.speed=+v;S.keep=+k;rate(au)}
  else return;saveS();eqUI()}}
function sleepUI(){const o=[[0,'s0'],[15,'s15'],[30,'s30'],[45,'s45'],[60,'s60'],[90,'s90'],[-1,'sEnd']];
 sheet(`<h3>${T('sleepT')}</h3>`+o.map(([v,l])=>`<button class="opt" data-v="${v}">${slm==v?'✓ ':''}${T(l)}</button>`).join(''));
 $('#sh').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const v=+b.dataset.v;clearTimeout(sl);endSl=0;slm=v;if(v>0)sl=setTimeout(()=>{au.pause();slm=0},v*60000);if(v<0)endSl=1;sleepUI()}}
$('#beq').onclick=eqUI;$('#bsl').onclick=sleepUI;
function fill(id){edit=id;pend={};const t=byId(id),u=cv(t);
 $('#ti').value=t?t.title:'';$('#ar').value=t?t.artist||'':'';
 $('#fcov').style.backgroundImage=u?`url(${u})`:'';$('#fcov').textContent=u?'':'+';
 $('#fl').style.display=t&&t.ext?'none':'block';labels()}
$('#fcf').onchange=e=>{const f=e.target.files[0];if(!f)return;pend.cover=f;$('#fcov').style.backgroundImage=`url(${URL.createObjectURL(f)})`;$('#fcov').textContent=''};
$('#fa').onchange=e=>{const f=e.target.files[0];if(!f)return;pend.audio=f;labels();if(!$('#ti').value)$('#ti').value=f.name.replace(/\.[^.]+$/,'')};
$('#sv').onclick=async()=>{
 let t=byId(edit);
 if(!t&&!pend.audio){$('#fl').textContent=T('needMp3');return}
 if(!t){t={id:Date.now()+(n++),audio:pend.audio,cover:null};manual.push(t);rebuild()}
 t.title=$('#ti').value.trim()||T('noName');t.artist=$('#ar').value.trim();
 if(pend.audio&&!t.ext)t.audio=pend.audio;if(pend.cover){t.cover=pend.cover;delete C[t.id];delete t.col}
 if(t.ext){ovr[t.id]={id:t.id,ext:1,title:t.title,artist:t.artist,cover:t.cover};await put('t',ovr[t.id])}else await put('t',t);
 fill(null);go(0);renderAll();sync()};
async function delTrack(t){const cur=queue[qi];await del('t',t.id);manual=manual.filter(x=>x!==t);rebuild();
 for(const l of lists)if(l.ids.some(i=>String(i)==String(t.id))){l.ids=l.ids.filter(i=>String(i)!=String(t.id));await put('p',l)}
 queue=queue.filter(x=>x!==t);if(cur===t){au.pause();qi=-1}else qi=cur?queue.indexOf(cur):-1;renderAll();sync()}
function acts(id){const t=byId(id),sid=String(t.id);
 sheet(`<h3>${esc(t.title)}</h3><button class="opt" data-a="ed">${T('editBtn')}</button><div class="lbl">${T('playlists')}</div>`+(lists.length?lists.map(l=>`<button class="opt" data-a="pl" data-l="${l.id}">${l.ids.some(i=>String(i)==sid)?'✓ ':''}${esc(l.name)}</button>`).join(''):`<div class="empty">${T('noPl')}</div>`)+`<button class="opt red" data-a="dl">${T(t.ext?'hide':'delTrack')}</button>`);
 $('#sh').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='ed'){shut();fill(t.id);go(1)}
  if(a=='pl'){const l=lists.find(x=>String(x.id)==b.dataset.l);l.ids=l.ids.some(i=>String(i)==sid)?l.ids.filter(i=>String(i)!=sid):[...l.ids,t.id];await put('p',l);acts(id);renderAll()}
  if(a=='dl'){shut();if(t.ext){S.hid.push(t.id);saveS();renderAll()}else await delTrack(t)}}}
function newPl(){pend2=null;
 sheet(`<h3>${T('newPl')}</h3><div class="plh"><label class="pi" id="pcv" for="pcf">+</label><input type="file" id="pcf" accept="image/*" hidden><input class="f" id="pn" placeholder="${T('plName')}"></div><small>${T('plCover')}</small><div style="height:14px"></div><button class="sv" id="pok">${T('create')}</button>`);
 $('#pcf').onchange=e=>{const f=e.target.files[0];if(!f)return;pend2=f;$('#pcv').style.backgroundImage=`url(${URL.createObjectURL(f)})`;$('#pcv').textContent=''};
 $('#pok').onclick=async()=>{const name=$('#pn').value.trim();if(!name)return;const l={id:Date.now()+(n++),name,cover:pend2,ids:[]};lists.push(l);await put('p',l);shut();renderAll()}}
function openPl(id){const l=lists.find(x=>String(x.id)==String(id)),arr=l.ids.map(i=>byId(i)).filter(Boolean);
 sheet(`<div class="plh"><div class="pi" style="${bg(cu(l.cover,'p'+l.id))}">${l.cover?'':'♪'}</div><div><h3 style="margin:0">${esc(l.name)}</h3><small>${arr.length} ${T('tracks')}</small></div></div><button class="sv" data-a="play">${T('play')}</button><div style="height:10px"></div>`+arr.map(t=>`<div class="row"><div class="th" style="${bg(cv(t))}">${cv(t)?'':'♪'}</div><div class="tx"><b>${esc(t.title)}</b><small>${esc(t.artist||'')}</small></div><button class="ed" data-r="${t.id}">✕</button></div>`).join('')+`<button class="opt red" data-a="del" style="margin-top:10px">${T('delPl')}</button>`);
 $('#sh').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a=='play'&&arr.length){shut();play(arr,0)}
  if(b.dataset.a=='del'){shut();lists=lists.filter(x=>x!==l);await del('p',l.id);renderAll()}
  if(b.dataset.r){l.ids=l.ids.filter(i=>String(i)!=b.dataset.r);await put('p',l);renderAll();openPl(id)}}}
$('#pen').onclick=newPl;
$('#list').onclick=e=>{const m=e.target.closest('[data-m]');if(m)return acts(m.dataset.m);const r=e.target.closest('.row');if(r)play(V,+r.dataset.i)};
$('#pls').onclick=e=>{const c=e.target.closest('[data-pl]');if(c)openPl(c.dataset.pl)};
async function clearAll(){await wipe('t');await wipe('p');manual=[];ovr={};lists=[];S.hid=[];saveS();rebuild();queue=[];qi=-1;E.forEach(e=>e.pause());au.removeAttribute('src');lastId=0;root.style.setProperty('--g','#8a8f9c');renderAll();sync()}
$('#sets').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.id,p=b.closest('.seg'),pid=p&&p.id;
 if(id=='tg1')S.glow^=1;else if(id=='tg2'){S.tint^=1;lastId=0}else if(id=='tg3')S.pulse^=1;else if(id=='tg4')S.lt^=1;else if(id=='tg5'){S.hs^=1;renderAll()}else if(id=='tg6'){S.ho^=1;renderAll()}
 else if(b.dataset.c)setAc(b.dataset.c);
 else if(pid=='cf')S.cf=+b.dataset.v;else if(pid=='ps')S.psens=+b.dataset.v;else if(pid=='thm'){S.theme=b.dataset.v;applyTheme()}else if(pid=='lg'){S.lang=b.dataset.v;saveS();applyLang();return}
 else if(id=='wsh'){showWel();return}else if(id=='scb'){if(A)A.askAudio();return}else if(id=='prm'){if(A)A.openSettings();return}
 else if(id=='clr'){if(!clr){clr=1;b.textContent=T('sure');return}clr=0;b.textContent=T('clear');clearAll();return}
 saveS();applyS();sync()};
$('#hx').oninput=e=>{if(setAc(e.target.value.trim())){saveS();$('#hxs').style.background=S.ac}};
applyTheme();fill(null);applyLang();
idb().then(async d=>{db=d;await loadAll();loaded=1;renderAll();sync();if(A&&A.hasAudio())scanNow()}).catch(()=>{loaded=1;renderAll()});
</script></body></html>
